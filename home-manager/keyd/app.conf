[firefox*]
# Add Emacs-style cursor movement to the existing Control layer.
control.b=left
control.f=right
control.p=up
control.n=down
control.a=home
control.e=end
control.u=pageup
control.d=pagedown
control.h=backspace
control.k=macro(S-end delete)

control+meta.b=C-M-b
control+meta.f=C-M-f
control+meta.p=C-M-p
control+meta.n=C-M-n
control+meta.a=C-M-a
control+meta.e=C-M-e
control+meta.u=C-M-u
control+meta.d=C-M-d
control+meta.h=C-M-h
control+meta.k=C-M-k

alt.b   = C-b
alt.f   = C-f
alt.p   = C-p
alt.n   = C-n
alt.a   = C-a
alt.e   = C-e
alt.u   = C-u
alt.d   = C-d
alt.h   = C-h
alt.k   = C-k

