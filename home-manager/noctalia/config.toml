[bar.default]
center = ["taskbar"]
concave_edge_corners = false
end = [
  "media",
  "tray",
  "notifications",
  "screenshot",
  "recorder",
  "clipboard",
  "bluetooth",
  "network",
  "volume",
  "brightness",
  "battery",
  "bar",
  "launcher",
  "control-center",
  "clock",
]
margin_ends = 10
start = [
  "session",
  "theme_mode",
  "wallpaper",
  "wallhaven",
]

[hooks]
theme_mode_changed = "systemctl --user restart xdg-desktop-portal-gtk.service && systemctl --user restart xdg-desktop-portal.service"

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660

[idle.behavior.suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900

[keybinds]
cancel = ["escape"]
down = ["down", "ctrl+n"]
left = ["left", "ctrl+b"]
right = ["right", "ctrl+f"]
up = ["up", "ctrl+p"]

[location]
address = "Okinawa, Japan"
custom_schedule = true
sunrise = "05:00"
sunset = "17:00"

[lockscreen]
edge_smoothness = 0.37999999150633812

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-login-box@DP-5",
  "lockscreen-widget-0000000000000001",
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-5"]
box_height = 196.0
box_width = 810.0
cx = 1280.0
cy = 1258.0
output = "DP-5"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-5".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_media_controls = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
box_height = 0.0
box_width = 0.0
cx = 1280.0
cy = 260.5
output = "DP-5"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
background = true
background_color = "surface_container"

[nightlight]
enabled = true

[plugin_settings."noctalia/screen_recorder"]
audio_codec = "aac"
copy_to_clipboard = true
frame_rate = 30
video_codec = "hevc"

[plugin_settings."noctalia/translator"]
target_lang = "ja"

[plugin_settings."noctalia/umbriel-companion"]
panel_open_near_click = false

[plugins]
enabled = [
  "noctalia/translator",
  "noctalia/screen_recorder",
  "noctalia/wallhaven",
  "noctalia/umbriel-companion",
]

[shell]
avatar_path = "~/.config/noctalia/avatar.png"
clipboard_auto_paste = "off"
clipboard_history_max_entries = 10000
clipboard_image_action_command = "noctalia msg annotate {path}"
launch_apps_as_systemd_services = true
polkit_agent = true
screen_time_enabled = true

[shell.animation]
enabled = false

[shell.greeter_sync]
auto_sync = true
privilege_command = "pkexec"

[shell.launcher.providers.session]
global = true

[shell.screenshot]
annotate = true
confirm_region = true
copy_on_close = true
remember_last_region = true

[shell.window_switcher]
mru = true
style = "icons"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "hyprland", "kcolorscheme", "qt", "umbriel"]

[wallpaper.default]
path = "/home/kyohei/Pictures/noctalia-wallpaper.png"

[wallpaper.last]
path = "/home/kyohei/Pictures/noctalia-wallpaper.png"

[wallpaper.monitors.DP-5]
path = "/home/kyohei/Pictures/noctalia-wallpaper.png"

[[wallpaper.favorite]]
builtin_palette = "Catppuccin"
palette_source = "builtin"
path = "/home/kyohei/Pictures/noctalia-wallpaper.png"
theme_mode = "dark"

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.cat]
audio_spectrum = true
input_devices = ["/dev/input/by-id/keyd-virtual-keyboard"]
rave_mode = true
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clipboard]
enabled = false

[widget.clock]
format = "%a %b %e %H:%M"

[widget.recorder]
enabled = false
type = "noctalia/screen_recorder:recorder"

[widget.screenshot]
enabled = false

[widget.taskbar]
group_by_workspace = true
inactive_opacity = 0.5

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"
